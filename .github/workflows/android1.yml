name: Build AAR

on:
  push:
    branches: [ "release" ]
  pull_request:
    branches: [ "release" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build AAR
        run: |
          ./gradlew \
            :lib-common:bundleReleaseAar \
            :lib-container:bundleReleaseAar \
            :lib-database:bundleReleaseAar \
            :lib-datasource:bundleReleaseAar \
            :lib-datasource-okhttp:bundleReleaseAar \
            :lib-datasource-rtmp:bundleReleaseAar \
            :lib-decoder:bundleReleaseAar \
            :lib-exoplayer:bundleReleaseAar \
            :lib-exoplayer-dash:bundleReleaseAar \
            :lib-exoplayer-hls:bundleReleaseAar \
            :lib-exoplayer-rtsp:bundleReleaseAar \
            :lib-exoplayer-smoothstreaming:bundleReleaseAar \
            :lib-extractor:bundleReleaseAar \
            :lib-session:bundleReleaseAar \
            :lib-ui:bundleReleaseAar \
            --stacktrace --console=plain

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: fongmi-media3-aar
          path: libraries/**/build/outputs/aar/*.aar
